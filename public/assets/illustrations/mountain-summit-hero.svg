<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="500" y1="0" x2="500" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080c18" />
      <stop offset="35%" stop-color="#1a0f3c" />
      <stop offset="65%" stop-color="#31134a" />
      <stop offset="85%" stop-color="#4c1d68" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <radialGradient id="sunDawn" cx="780" cy="180" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1a0f3c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mountBack" x1="500" y1="120" x2="500" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="mountMid" x1="500" y1="160" x2="500" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="mountFore" x1="200" y1="200" x2="200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="flagGrad" x1="770" y1="50" x2="840" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="ascentGlow" x1="280" y1="360" x2="780" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="neonFlagBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="trailGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1000" height="400" fill="url(#skyGrad)" />
  <circle cx="780" cy="180" r="280" fill="url(#sunDawn)" />

  <g opacity="0.6">
    <circle cx="120" cy="40" r="1.5" fill="#ffffff" />
    <circle cx="280" cy="70" r="1.2" fill="#ffffff" />
    <circle cx="450" cy="30" r="2" fill="#38bdf8" />
    <circle cx="620" cy="50" r="1.5" fill="#f472b6" />
    <circle cx="710" cy="25" r="1" fill="#ffffff" />
    <circle cx="890" cy="60" r="1.8" fill="#ffffff" />
    <circle cx="950" cy="110" r="1.2" fill="#a5f3fc" />
    <circle cx="340" cy="110" r="1" fill="#ffffff" />
    <circle cx="180" cy="130" r="1.5" fill="#ffffff" />
  </g>

  <path d="M0 260L90 220L190 250L310 190L460 240L580 180L710 210L830 140L920 180L1000 150V400H0V260Z" fill="url(#mountBack)" opacity="0.85" />
  <path d="M0 320L140 260L260 290L380 230L510 280L660 190L780 84L870 210L1000 240V400H0V320Z" fill="url(#mountMid)" />

  <path d="M260 330C320 330 360 300 420 300C490 300 530 260 590 250C660 240 700 170 750 140C770 128 775 102 780 88" stroke="url(#ascentGlow)" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#trailGlow)" />
  <path d="M260 330C320 330 360 300 420 300C490 300 530 260 590 250C660 240 700 170 750 140C770 128 775 102 780 88" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6" fill="none" />

  <circle cx="260" cy="330" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2" />
  <circle cx="420" cy="300" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="2" />
  <circle cx="590" cy="250" r="6" fill="#3b82f6" stroke="#ffffff" stroke-width="2" />
  <circle cx="750" cy="140" r="6" fill="#a855f7" stroke="#ffffff" stroke-width="2" />

  <g id="summitFlag">
    <line x1="780" y1="84" x2="780" y2="28" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
    <circle cx="780" cy="28" r="4" fill="#facc15" filter="url(#neonFlagBlur)" />
    <path d="M780 32C815 28 840 42 875 34V66C840 72 815 58 780 64V32Z" fill="url(#flagGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#neonFlagBlur)" />
    <text x="824" y="54" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" letter-spacing="0.05em">1600</text>
  </g>

  <path d="M0 310L120 270L240 280L310 350L280 400H0V310Z" fill="url(#mountFore)" />

  <g id="coderFigure" transform="translate(180, 240)">
    <path d="M-20 45L40 42L70 65L-20 70Z" fill="#0f172a" />
    <rect x="0" y="8" width="14" height="20" rx="4" fill="#0284c7" />
    <path d="M12 4C18 4 24 10 24 22L12 24L8 10C8 6 10 4 12 4Z" fill="#4f46e5" />
    <path d="M14 6L20 18" stroke="#818cf8" stroke-width="2" />
    <circle cx="20" cy="-4" r="7" fill="#fcd34d" />
    <circle cx="19" cy="-5" r="7" fill="#1e1b4b" />
    <path d="M22 22L36 28L32 44" stroke="#1e293b" stroke-width="5" stroke-linecap="round" />
    <path d="M18 22L28 32L24 46" stroke="#334155" stroke-width="5" stroke-linecap="round" />
    <rect x="30" y="42" width="8" height="4" rx="2" fill="#e11d48" />
    <path d="M18 14L32 18" stroke="#4f46e5" stroke-width="4" stroke-linecap="round" />
    <polygon points="30,22 46,20 48,22 32,24" fill="#94a3b8" />
    <polygon points="30,22 34,10 48,9 46,20" fill="#38bdf8" />
    <circle cx="38" cy="14" r="14" fill="#38bdf8" opacity="0.35" filter="url(#trailGlow)" />
  </g>
