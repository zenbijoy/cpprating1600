<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <defs>
    <!-- Left shape cyan to blue gradient -->
    <linearGradient id="darkLeftGrad" x1="116" y1="646" x2="526" y2="334" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C0FF" />
      <stop offset="50%" stop-color="#007CF0" />
      <stop offset="100%" stop-color="#0051FF" />
    </linearGradient>

    <!-- Right shape blue to purple gradient -->
    <linearGradient id="darkRightGrad" x1="479" y1="418" x2="892" y2="646" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0051FF" />
      <stop offset="45%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Text 1600 gradient -->
    <linearGradient id="darkTextGrad" x1="600" y1="750" x2="940" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
